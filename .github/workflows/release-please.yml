name: Release

# Cuts a GitHub Release and bumps package.json/CHANGELOG.md from conventional
# commits on main. Nothing is published to a registry here; see publish-mcp.yml.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
          package-name: free-crypto-news
